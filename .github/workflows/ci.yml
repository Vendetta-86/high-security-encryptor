name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Scan committed secrets
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Audit dependencies
        run: python -m pip_audit . --progress-spinner off

      - name: Check syntax
        run: python -m compileall -q src tests

      - name: Run HSE2 create CLI tests
        run: python -m unittest tests.test_hse2_create_cli -v

      - name: Run HSE2 open CLI restore test
        run: python -m unittest tests.test_hse2_open_cli.HSE2OpenCliTests.test_open_cli_restores_keyfile_only_archive -v

      - name: Run HSE2 open CLI wrong-keyfile test
        run: python -m unittest tests.test_hse2_open_cli.HSE2OpenCliTests.test_open_cli_rejects_wrong_keyfile -v

      - name: Run HSE2 open CLI overwrite test
        run: python -m unittest tests.test_hse2_open_cli.HSE2OpenCliTests.test_open_cli_refuses_existing_file_without_overwrite -v

      - name: Run HSE2 open CLI missing-material test
        run: python -m unittest tests.test_hse2_open_cli.HSE2OpenCliTests.test_open_cli_requires_unlock_material -v

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke test console script
        run: high-security-encryptor --help
