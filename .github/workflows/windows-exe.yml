name: Windows EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag label for the zip; when publishing, it must match the selected tag ref.
        required: false
        type: string
        default: ""
      publish_release:
        description: Create or update a public GitHub Release after a successful build.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    outputs:
      asset_name: ${{ steps.package.outputs.asset_name }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and build tools
        run: python -m pip install -e ".[build,dev]"

      - name: Scan committed secrets
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Audit dependencies
        run: python -m pip_audit . --progress-spinner off

      - name: Check syntax
        run: python -m compileall -q src tests build_tools

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Smoke test console script
        run: |
          high-security-encryptor --help
          high-security-encryptor-gui --smoke-test
          high-security-encryptor-hse2-create --help
          high-security-encryptor-hse2-open --help
          high-security-encryptor-hse2-header-backup --help
          high-security-encryptor-hse2-inspect --help
          high-security-encryptor-hse2-wrapper --help
          high-security-encryptor-hse2-access --help
          high-security-encryptor hse2 v4-create --help
          high-security-encryptor hse2 v4-open --help
          high-security-encryptor hse2 v4-replace --help
          high-security-encryptor hse2 v5-create --help
          high-security-encryptor hse2 v5-open --help
          high-security-encryptor hse2 v5-verify --help
          high-security-encryptor hse2 v5-preview --help
          high-security-encryptor hse2 v5-password-update --help
          high-security-encryptor hse2 v5-replace --help
          high-security-encryptor hse2 v5-compact --help
          high-security-encryptor hse2 v4-to-v5 --help

      - name: Build CLI executable
        run: >
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --console
          --name high-security-encryptor
          --paths src
          --distpath dist\hse-windows-x64
          --workpath build\hse-pyinstaller
          --specpath build\hse-spec
          build_tools\pyinstaller_entry.py

      - name: Build GUI executable
        run: >
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name high-security-encryptor-gui
          --paths src
          --distpath dist\hse-windows-x64
          --workpath build\hse-gui-pyinstaller
          --specpath build\hse-gui-spec
          build_tools\pyinstaller_gui_entry.py

      - name: Build HSE2 GUI executable
        run: >
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name high-security-encryptor-hse2-gui
          --paths src
          --distpath dist\hse-windows-x64
          --workpath build\hse2-gui-pyinstaller
          --specpath build\hse2-gui-spec
          build_tools\pyinstaller_hse2_gui_entry.py

      - name: Build HSE2 helper CLI executables
        shell: pwsh
        run: |
          $helpers = @(
            @{ Name = "high-security-encryptor-hse2-create"; Entry = "build_tools\pyinstaller_hse2_create_entry.py"; Work = "build\hse2-create-pyinstaller"; Spec = "build\hse2-create-spec" },
            @{ Name = "high-security-encryptor-hse2-open"; Entry = "build_tools\pyinstaller_hse2_open_entry.py"; Work = "build\hse2-open-pyinstaller"; Spec = "build\hse2-open-spec" },
            @{ Name = "high-security-encryptor-hse2-header-backup"; Entry = "build_tools\pyinstaller_hse2_header_backup_entry.py"; Work = "build\hse2-header-backup-pyinstaller"; Spec = "build\hse2-header-backup-spec" },
            @{ Name = "high-security-encryptor-hse2-inspect"; Entry = "build_tools\pyinstaller_hse2_inspect_entry.py"; Work = "build\hse2-inspect-pyinstaller"; Spec = "build\hse2-inspect-spec" },
            @{ Name = "high-security-encryptor-hse2-archive-validate"; Entry = "build_tools\pyinstaller_hse2_archive_validate_entry.py"; Work = "build\hse2-archive-validate-pyinstaller"; Spec = "build\hse2-archive-validate-spec" },
            @{ Name = "high-security-encryptor-hse2-wrapper"; Entry = "build_tools\pyinstaller_hse2_wrapper_entry.py"; Work = "build\hse2-wrapper-pyinstaller"; Spec = "build\hse2-wrapper-spec" },
            @{ Name = "high-security-encryptor-hse2-access"; Entry = "build_tools\pyinstaller_hse2_access_entry.py"; Work = "build\hse2-access-pyinstaller"; Spec = "build\hse2-access-spec" }
          )
          foreach ($helper in $helpers) {
            python -m PyInstaller `
              --clean `
              --noconfirm `
              --onefile `
              --console `
              --name $helper.Name `
              --paths src `
              --distpath dist\hse-windows-x64 `
              --workpath $helper.Work `
              --specpath $helper.Spec `
              $helper.Entry
          }

      - name: Smoke test executable
        shell: pwsh
        run: |
          dist\hse-windows-x64\high-security-encryptor.exe --help
          dist\hse-windows-x64\high-security-encryptor.exe validate-config --kind encrypt --config examples\hardened_encrypt.json --report
          dist\hse-windows-x64\high-security-encryptor-gui.exe --smoke-test
          dist\hse-windows-x64\high-security-encryptor-hse2-gui.exe --smoke-test
          $exe = "dist\hse-windows-x64\high-security-encryptor.exe"
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("hse2-v4-smoke-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $primary = Join-Path $smokeRoot "primary.txt"
          $secondary = Join-Path $smokeRoot "secondary.txt"
          $replacement = Join-Path $smokeRoot "replacement.txt"
          Set-Content -LiteralPath $primary -Value "primary package smoke" -NoNewline
          Set-Content -LiteralPath $secondary -Value "secondary package smoke" -NoNewline
          Set-Content -LiteralPath $replacement -Value "updated package smoke" -NoNewline
          $primaryPassword = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) # pragma: allowlist secret
          $secondaryPassword = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) # pragma: allowlist secret
          @($primaryPassword, $primaryPassword, $secondaryPassword, $secondaryPassword) |
            & $exe hse2 v4-create --passwords-stdin --output (Join-Path $smokeRoot "candidate.hse2") --capacity-records 2 --primary-file "primary.txt=$primary" --secondary-file "secondary.txt=$secondary"
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4-create smoke failed" }
          $container = Join-Path $smokeRoot "candidate.hse2"
          $primaryOutput = Join-Path $smokeRoot "primary-restored"
          $secondaryOutput = Join-Path $smokeRoot "secondary-restored"
          $primaryPassword | & $exe hse2 v4-open --password-stdin --input $container --output-dir $primaryOutput
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4 primary-open smoke failed" }
          $secondaryPassword | & $exe hse2 v4-open --password-stdin --input $container --output-dir $secondaryOutput
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4 secondary-open smoke failed" }
          if ((Get-FileHash (Join-Path $primaryOutput "primary.txt")).Hash -ne (Get-FileHash $primary).Hash) { throw "Packaged v4 primary bytes differ" }
          if ((Get-FileHash (Join-Path $secondaryOutput "secondary.txt")).Hash -ne (Get-FileHash $secondary).Hash) { throw "Packaged v4 secondary bytes differ" }
          $updatedContainer = Join-Path $smokeRoot "updated.hse2"
          $primaryPassword | & $exe hse2 v4-replace --password-stdin --input $container --output $updatedContainer --file "primary.txt=$replacement"
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4-replace smoke failed" }
          $updatedOutput = Join-Path $smokeRoot "updated-restored"
          $primaryPassword | & $exe hse2 v4-open --password-stdin --input $updatedContainer --output-dir $updatedOutput
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4 updated-open smoke failed" }
          if ((Get-FileHash (Join-Path $updatedOutput "primary.txt")).Hash -ne (Get-FileHash $replacement).Hash) { throw "Packaged v4 replacement bytes differ" }
          $peerOutput = Join-Path $smokeRoot "peer-restored-after-update"
          $secondaryPassword | & $exe hse2 v4-open --password-stdin --input $updatedContainer --output-dir $peerOutput
          if ($LASTEXITCODE -ne 0) { throw "Packaged v4 peer-open smoke failed" }
          if ((Get-FileHash (Join-Path $peerOutput "secondary.txt")).Hash -ne (Get-FileHash $secondary).Hash) { throw "Packaged v4 peer view changed" }
          $v5Password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) # pragma: allowlist secret
          $v5SecondaryPassword = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) # pragma: allowlist secret
          @($v5Password, $v5Password, $v5SecondaryPassword, $v5SecondaryPassword) |
            & $exe hse2 v5-create --passwords-stdin --output (Join-Path $smokeRoot "candidate-v5.hse2") --primary-file "primary.txt=$primary" --secondary-file "secondary.txt=$secondary"
          if ($LASTEXITCODE -ne 0) { throw "Packaged v5-create smoke failed" }
          $v5Container = Join-Path $smokeRoot "candidate-v5.hse2"
          $v5Password | & $exe hse2 v5-verify --password-stdin --input $v5Container
          if ($LASTEXITCODE -ne 0) { throw "Packaged v5-verify smoke failed" }
          $v5Restore = Join-Path $smokeRoot "v5-restored"
          $v5Password | & $exe hse2 v5-open --password-stdin --input $v5Container --output-dir $v5Restore
          if ($LASTEXITCODE -ne 0) { throw "Packaged v5-open smoke failed" }
          if ((Get-FileHash (Join-Path $v5Restore "primary.txt")).Hash -ne (Get-FileHash $primary).Hash) { throw "Packaged v5 restore bytes differ" }
          $expected = @(
            "high-security-encryptor-hse2-gui.exe",
            "high-security-encryptor-hse2-create.exe",
            "high-security-encryptor-hse2-open.exe",
            "high-security-encryptor-hse2-header-backup.exe",
            "high-security-encryptor-hse2-inspect.exe",
            "high-security-encryptor-hse2-archive-validate.exe",
            "high-security-encryptor-hse2-wrapper.exe",
            "high-security-encryptor-hse2-access.exe"
          )
          foreach ($name in $expected) {
            if (-not (Test-Path "dist\hse-windows-x64\$name")) {
              throw "$name was not built"
            }
          }
          dist\hse-windows-x64\high-security-encryptor-hse2-create.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-open.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-header-backup.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-inspect.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-archive-validate.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-wrapper.exe --help
          dist\hse-windows-x64\high-security-encryptor-hse2-access.exe --help

      - name: Package executable
        id: package
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release tag or asset label: $env:RELEASE_TAG"
          }
          $assetName = "high-security-encryptor-$env:RELEASE_TAG-windows-x64.zip"
          $staging = "dist\release\high-security-encryptor"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging\docs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$staging\examples" -Force | Out-Null
          Copy-Item "dist\hse-windows-x64\high-security-encryptor.exe" "$staging\high-security-encryptor.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-gui.exe" "$staging\high-security-encryptor-gui.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-gui.exe" "$staging\high-security-encryptor-hse2-gui.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-create.exe" "$staging\high-security-encryptor-hse2-create.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-open.exe" "$staging\high-security-encryptor-hse2-open.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-header-backup.exe" "$staging\high-security-encryptor-hse2-header-backup.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-inspect.exe" "$staging\high-security-encryptor-hse2-inspect.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-archive-validate.exe" "$staging\high-security-encryptor-hse2-archive-validate.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-wrapper.exe" "$staging\high-security-encryptor-hse2-wrapper.exe"
          Copy-Item "dist\hse-windows-x64\high-security-encryptor-hse2-access.exe" "$staging\high-security-encryptor-hse2-access.exe"
          Copy-Item "README.md" "$staging\README.md"
          Copy-Item "docs\release_beginner_readme_zh.txt" "$staging\新手必看.txt"
          Copy-Item "docs\windows_exe.md" "$staging\windows_exe.md"
          Copy-Item "docs\*" "$staging\docs" -Recurse
          Copy-Item "examples\beginner_encrypt_config.json" "$staging\examples\beginner_encrypt_config.json"
          Copy-Item "examples\beginner_multi_file_encrypt_config.json" "$staging\examples\beginner_multi_file_encrypt_config.json"
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\$assetName" -Force
          "ASSET_NAME=$assetName" >> $env:GITHUB_ENV
          "ASSET_PATH=dist\$assetName" >> $env:GITHUB_ENV
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}
  verify_artifact:
    name: Verify downloaded Windows artifact
    needs: build
    runs-on: ubuntu-latest
    env:
      ASSET_NAME: ${{ needs.build.outputs.asset_name }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.asset_name }}
          path: dist

      - name: Verify packaged ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/$ASSET_NAME"
          unzip -t "dist/$ASSET_NAME"
          entries="$(unzip -Z1 "dist/$ASSET_NAME")"
          for expected in \
            "docs/beginner/README.md" \
            "docs/beginner/glossary.md" \
            "docs/beginner/first-run.md" \
            "docs/beginner_gui_usage.md" \
            "docs/progress/20261103-hse2-roadmap-3.0-phase3-feature-inventory.md"; do
            if ! printf '%s\n' "$entries" | grep -Fxq "$expected"; then
              echo "Missing beginner resource in release ZIP: $expected" >&2
              exit 1
            fi
          done
          sha256sum "dist/$ASSET_NAME"

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    name: Publish approved Windows release
    needs: [build, verify_artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ASSET_NAME: ${{ needs.build.outputs.asset_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the selected ref to match the release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "Publishing requires workflow_dispatch on the exact release tag ref." >&2
            exit 1
          fi

      - name: Download build artifact for release upload
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.asset_name }}
          path: dist

      - name: Upload release asset
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_notes="docs/releases/$RELEASE_TAG.md"
            release_flags=()
            if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)([.-]|$) ]]; then
              release_flags+=(--prerelease)
            fi
            if [[ -f "$release_notes" ]]; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$release_notes" "${release_flags[@]}"
            else
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes "Windows executable build for $RELEASE_TAG." "${release_flags[@]}"
            fi
          fi
          gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
